<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#146950">
  <meta name="color-scheme" content="light">
  <title>Hello · MyMiniCloud</title>
  <style>
    /* Self-contained so the same page works on port 8085 and through /api/. */
    :root { --paper:#f7f8f2; --ink:#183a36; --muted:#60746d; --green:#146950; --lime:#d9eb9c; --line:#dce2d8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.7 'Segoe UI',Arial,sans-serif; }
    .shell { width:min(880px,calc(100% - 40px)); margin:auto; }
    header { border-bottom:1px solid var(--line); }
    .brand { min-height:85px; display:flex; align-items:center; gap:10px; font-size:23px; font-weight:700; letter-spacing:-1px; }
    .brand svg { width:35px; height:35px; color:var(--green); }
    .brand span span { font-weight:400; }
    main { padding:64px 0 80px; min-height:calc(100vh - 160px); }
    .eyebrow { margin:0 0 18px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
    h1 { margin:0 0 18px; font:400 clamp(36px,6vw,52px)/1.2 Georgia,'Times New Roman',serif; letter-spacing:-1px; }
    h1 em { color:var(--green); }
    .intro { color:var(--muted); margin:0 0 32px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .card-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:18px 24px; border-bottom:1px solid var(--line); }
    .card-head h2 { margin:0; font-size:14px; font-weight:600; }
    .status { display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:4px; background:#edf3e7; color:var(--green); font-size:11px; font-weight:600; }
    .status::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--green); }
    .message { margin:0; padding:32px 24px; font-size:clamp(18px,3.5vw,24px); font-weight:600; overflow-wrap:anywhere; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:14px 24px; margin-top:24px; }
    a { color:var(--green); text-decoration:none; font-size:13px; }
    a:hover { text-decoration:underline; text-underline-offset:4px; }
    .button { padding:10px 19px; border:1px solid var(--green); border-radius:5px; background:var(--green); color:white; font-weight:600; }
    .button:hover { background:var(--ink); text-decoration:none; }
    :focus-visible { outline:3px solid #a57630; outline-offset:4px; }
    ::selection { background:var(--lime); color:var(--ink); }
    footer { border-top:1px solid var(--line); padding:24px 0; color:var(--muted); font-size:11px; }
    @media(max-width:480px) { main { padding:40px 0 56px; } .brand { min-height:73px; } .card-head { padding:16px 20px; } .message { padding:26px 20px; } }
  </style>
</head>
<body>
  <header><div class="shell brand">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M10 29h21a7 7 0 0 0 0-14h-1A11 11 0 0 0 9 13a8 8 0 0 0 1 16Z" stroke="currentColor" stroke-width="2.3"/><path d="m15 21 5 4 6-7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>MyMini<span>Cloud</span></span>
  </div></header>
  <main class="shell">
    <p class="eyebrow">Nhóm 13 · MyMiniCloud</p>
    <h1>Một lời chào từ <em>đám mây.</em></h1>
    <p class="intro">Yêu cầu của bạn đã được App Server tiếp nhận và phản hồi thành công.</p>
    <section class="card" aria-labelledby="response-heading">
      <div class="card-head"><h2 id="response-heading">Phản hồi từ máy chủ</h2><span class="status">200 OK</span></div>
      <p class="message">{{ message }}</p>
    </section>
    <nav class="actions" aria-label="Thao tác"><a class="button" href="?">Gửi lại yêu cầu <span aria-hidden="true">↻</span></a><a href="?format=json">Xem JSON gốc <span aria-hidden="true">↗</span></a></nav>
  </main>
  <footer><div class="shell">© 2026 MyMiniCloud · Nhóm 13 · Những thành phần nhỏ. Một hệ thống kết nối.</div></footer>
</body>
</html>
