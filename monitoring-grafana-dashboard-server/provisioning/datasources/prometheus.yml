apiVersion: 1

datasources:
  - name: Prometheus
    # Bắt buộc dùng đúng tên container trong docker-compose, không dùng "prometheus".
    url: http://monitoring-prometheus-server:9090
    type: prometheus
    access: proxy
    isDefault: true
    editable: true
    uid: prometheus
    jsonData:
      httpMethod: POST
      timeInterval: 15s
