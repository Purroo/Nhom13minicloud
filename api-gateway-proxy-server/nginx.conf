events {}

http {
    # Docker's embedded DNS server (127.0.0.11) — dùng để resolve động tên container.
    # Nếu không có resolver, Nginx sẽ cache IP của container một lần và giữ nguyên
    # sau khi container được recreate -> request tới upstream cũ bị "Connection refused".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Mở rộng 10: Cấu hình Load Balancing bằng thuật toán Round Robin (mặc định của Nginx)
    upstream web_backend {
        # `zone` bắt buộc để nginx có shared memory cho việc resolve runtime.
        # `resolve` cho phép Nginx tra cứu lại DNS theo chu kỳ thay vì cache cứng.
        zone web_backend 64k;
        server web-frontend-server1:80 resolve;
        server web-frontend-server2:80 resolve;
    }

    server {
        listen 80;

        # 1. Web tĩnh (Qua bộ cân bằng tải Round Robin giữa Server 1 và Server 2)
        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. App API (Cơ bản & Mở rộng 2, 3: tự động cắt bỏ tiền tố /api/ khi gửi vào Flask)
        location /api/ {
            proxy_pass http://application-backend-server:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route /student/ (Yêu cầu Mở rộng 9: trỏ trực tiếp tới API /student của Backend)
        location /student/ {
            proxy_pass http://application-backend-server:8081/student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Keycloak Auth Server (Cơ bản: chuyển tiếp sang Keycloak)
        location /auth/ {
            proxy_pass http://authentication-identity-server:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}